[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-rrhh-harness"
version = "0.1.0"
description = "Asistente de RR. HH. con supervisión humana (HITL), skills modulares y Hugging Face Inference Providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Proyecto educativo individual" }]
dependencies = [
  "streamlit>=1.41,<2.0",
  "huggingface_hub>=0.32,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
